<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --border-color: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s;
            padding: 0.5rem 0;
        }

        .nav-btn:hover,
        .nav-btn.active {
            color: var(--accent-color);
            border-bottom: 2px solid var(--accent-color);
        }

        main {
            flex: 1;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-section {
            display: none;
        }

        .page-section.active {
            display: block;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .search-container {
            display: flex;
            gap: 0.5rem;
            max-width: 600px;
            margin-bottom: 2rem;
        }

        .search-container input {
            flex: 1;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-container input:focus {
            border-color: var(--accent-color);
        }

        .search-container button {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            border: none;
            background-color: var(--accent-color);
            color: var(--bg-color);
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .search-container button:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">EnzoFlix</div>
        <nav class="nav-links">
            <button class="nav-btn active">Accueil</button>
        </nav>
    </header>

    <main>
        <section id="accueil" class="page-section active">
            <h1>Bienvenue sur EnzoFlix</h1>
            <p class="subtitle">Recherchez vos films préférés.</p>
           
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Rechercher un film (ex: Batman, Avatar)...">
                <button id="searchButton">Rechercher</button>
            </div>

            <div id="accueilMoviesGrid" class="movies-grid"></div>
        </section>
    </main>

</body>
</html>
