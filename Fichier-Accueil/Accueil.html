<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Accueil.css">
    <title>Accueil</title>
   
    <link href="style.css" rel="stylesheet">
</head>
<body>

    <header>
        <div class="logo">EnFlix</div>
        <nav class="nav-links">
            <button class="nav-btn active">Accueil</button>
        </nav>
    </header>
    
    <main>
        <section id="accueil" class="page-section active">
            <h1>Bienvenue sur EnFlix</h1>
            <p class="subtitle">Recherchez vos films préférés.</p>
           
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Rechercher un film (ex: Batman, Avatar)...">
                <button id="searchButton">Rechercher</button>
            </div>

            <div id="accueilMoviesGrid" class="movies-grid"></div>
        </section>
    </main>
<script src="Accueil.js"></script>
</body>
</html>
