<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Catalogue.css">
    <title>EnzoFlix</title>
    
</head>
<body>
    <section id="Categories" class="page-section">
        <h1>Naviguer dans les catégories</h1>
        <p class="soustitre">Sélectionnez un genre pour voir vos films en fonction de vos préférences.</p>
        <div class="category-buttons">
            <button class="cat-btn" onclick="fetchCategory('Action')">Action</button>
            <button class="cat-btn" onclick="fetchCategory('Comedy')">Comédie</button>
            <button class="cat-btn" onclick="fetchCategory('Horror')">Horreur</button>
            <button class="cat-btn" onclick="fetchCategory('Sci-Fi')">Science-Fiction</button>
        </div>
        <div id="categoryMoviesGrid" class="movie-grid"></div>
    </section>
<script src="Accueil.js"></script>
</body>
</html>
